<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 840" width="1220" height="840"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b3a37"/></marker></defs><rect width="1220" height="840" fill="#ffffff"/><text x="610.0" y="32" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="middle">TabCount architecture: OpenCV 5 pipeline on AWS</text><rect x="20" y="200" width="200" height="110" rx="10" fill="#f4f4f2" stroke="#52514e" stroke-width="1.5"/><text x="120.0" y="233.5" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="middle">Phone browser</text><text x="120.0" y="250.5" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3b3a37" text-anchor="middle">index.html (vanilla JS)</text><text x="120.0" y="267.5" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3b3a37" text-anchor="middle">resizes to 1600 px JPEG</text><text x="120.0" y="284.5" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3b3a37" text-anchor="middle">before upload</text><rect x="20" y="470" width="200" height="100" rx="10" fill="#f4f4f2" stroke="#52514e" stroke-width="1.5"/><text x="120.0" y="507.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="middle">Eval &amp; benchmark</text><text x="120.0" y="524.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#33415c" text-anchor="middle">run_eval.py --url</text><text x="120.0" y="541.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#33415c" text-anchor="middle">benchmark.py</text><rect x="250" y="5